version: 1

# 記事本文（.svx）の表記揺れを統一する辞書（textlint-rule-prh）。
#
# コードブロック・インラインコードは textlint の Markdown パーサが別ノードにするため
# 対象外になる（デモの掲載コードのコメントは検査されない）。地の文・見出し・
# :Anki[] の中身は検査される。
#
# specs は辞書の自己テストで、読み込み時に検証される（期待と違えばエラーで止まる）。

rules:
  # ---- 漢字で書く語 -------------------------------------------------------
  - expected: 元々
    pattern: もともと
    specs:
      - from: もともと「ある点から別の点へ向かう矢印」
        to: 元々「ある点から別の点へ向かう矢印」

  # 形式名詞の「ぶん」は漢字で書く（「〜しているぶん、」→「〜している分、」）。
  # 直前が「の・な」（連体修飾）か、動詞・形容詞の活用語尾のときだけ置き換える。
  # 「たぶん（多分）」「じゅうぶん（十分）」「ぶぶん（部分）」「半分ぶん」のように、
  # 「分」以外の語や「分」が直前にある形は対象にしない。
  # 対象を広げたいときは文字クラスに活用語尾を足す。
  - expected: $1分
    pattern: /(?<!ゅ)([のなるいうつくすむり])ぶん/
    specs:
      - from: "`2`乗しているぶん、分散の大きさは"
        to: "`2`乗している分、分散の大きさは"
      - from: 制御点を増やすと、そのぶん次数が上がって
        to: 制御点を増やすと、その分次数が上がって
      - from: 分母を持つぶん計算は重くなる
        to: 分母を持つ分計算は重くなる
      - from: 高さの半分ぶん戻した位置に置く
        to: 高さの半分ぶん戻した位置に置く
      - from: たぶん、じゅうぶんな部分
        to: たぶん、じゅうぶんな部分

  - expected: 杆体
    pattern: 桿体
    specs:
      - from: 桿体は明暗の判別に働く
        to: 杆体は明暗の判別に働く

  # 「あいだ」は漢字で書く。かなで書いた「〜あい」に「だ」が続く語（ばあいだ・
  # わりあいだ など）は記事では常に漢字で書いているため、絞り込みはしていない。
  - expected: 間
    pattern: あいだ
    specs:
      - from: カメラが写す範囲は、モデリング変換のあいだに現れる
        to: カメラが写す範囲は、モデリング変換の間に現れる
      - from: 内側から山と山のあいだの谷（外側）へ出る
        to: 内側から山と山の間の谷（外側）へ出る
      - from: 両眼で見ているあいだは互いに視野を補い合う
        to: 両眼で見ている間は互いに視野を補い合う
      - from: 円柱を引けば円い穴のあいた板になり
        to: 円柱を引けば円い穴のあいた板になり

  # 「ほか」は漢字で書く。ただし「〜にほかなりません」「〜するほかない」のように
  # 直後が「な」のときは漢字にすると不自然なので置き換えない。
  - expected: 他
    pattern: /ほか(?!な)/
    specs:
      - from: 描画のほかに音声の再生や入力機器の扱いまで含んだ
        to: 描画の他に音声の再生や入力機器の扱いまで含んだ
      - from: 明るい領域の境界はほかよりも明るく見え
        to: 明るい領域の境界は他よりも明るく見え
      - from: ほかと比べたときの順序や大小を表す数値
        to: 他と比べたときの順序や大小を表す数値
      - from: この集まりこそが、まさにラスタ表現にほかなりません。
        to: この集まりこそが、まさにラスタ表現にほかなりません。

  # 「そろう」「そろえる」は活用語尾までまとめて漢字で書く（揃わ・揃い・揃う・
  # 揃え・揃お・揃っ）。「そろそろいい」のような「そろそろ」＋活用語尾と同じ並びを
  # 拾ってしまうため、直前が「そろ」のときは置き換えない。
  - expected: 揃$1
    pattern: /(?<!そろ)そろ([わいうえおっ])/
    specs:
      - from: 偶数個でそろうのです。
        to: 偶数個で揃うのです。
      - from: 境界に沿って接平面までそろえると、つなぎ目が見えなくなります
        to: 境界に沿って接平面まで揃えると、つなぎ目が見えなくなります
      - from: つなぎ目のそろえ方には段階があります
        to: つなぎ目の揃え方には段階があります
      - from: 倍率がそろい、半径
        to: 倍率が揃い、半径
      - from: そろそろいいだろう
        to: そろそろいいだろう

  # ---- かなで書く語 -------------------------------------------------------
  # 「この時」は「この時代」「この時期」「この時点」「この時間」「この時刻」
  # 「この時計」「この時系列」と続くと別語になるため、その続き字が来ない場合だけ
  # かなに置き換える。
  - expected: このとき
    pattern: /この時(?![代期点間刻計系])/
    specs:
      - from: この時、光は波長ごとに分かれます
        to: このとき、光は波長ごとに分かれます
      - from: この時代のヨーロッパでは
        to: この時代のヨーロッパでは
      - from: この時点では色みの差は現れません
        to: この時点では色みの差は現れません

  - expected: たとえば
    pattern: 例えば
    specs:
      - from: 例えば、赤と緑の間には黄色が見られます
        to: たとえば、赤と緑の間には黄色が見られます
