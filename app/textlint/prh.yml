version: 1

# 記事本文（.svx）の表記揺れを統一する辞書（textlint-rule-prh）。
#
# コードブロック・インラインコードは textlint の Markdown パーサが別ノードにするため
# 対象外になる（デモの掲載コードのコメントは検査されない）。地の文・見出し・
# :Anki[] の中身は検査される。
#
# specs は辞書の自己テストで、読み込み時に検証される（期待と違えばエラーで止まる）。

rules:
  # ---- 漢字で書く語 -------------------------------------------------------
  - expected: 元々
    pattern: もともと
    specs:
      - from: もともと「ある点から別の点へ向かう矢印」
        to: 元々「ある点から別の点へ向かう矢印」

  # 形式名詞の「ぶん」は漢字で書く（「〜しているぶん、」→「〜している分、」）。
  # 直前が「の・な」（連体修飾）か、動詞・形容詞の活用語尾のときだけ置き換える。
  # 「たぶん（多分）」「じゅうぶん（十分）」「ぶぶん（部分）」「半分ぶん」のように、
  # 「分」以外の語や「分」が直前にある形は対象にしない。
  # 対象を広げたいときは文字クラスに活用語尾を足す。
  - expected: $1分
    pattern: /(?<!ゅ)([のなるいうつくすむり])ぶん/
    specs:
      - from: "`2`乗しているぶん、分散の大きさは"
        to: "`2`乗している分、分散の大きさは"
      - from: 制御点を増やすと、そのぶん次数が上がって
        to: 制御点を増やすと、その分次数が上がって
      - from: 分母を持つぶん計算は重くなる
        to: 分母を持つ分計算は重くなる
      - from: 高さの半分ぶん戻した位置に置く
        to: 高さの半分ぶん戻した位置に置く
      - from: たぶん、じゅうぶんな部分
        to: たぶん、じゅうぶんな部分

  - expected: 杆体
    pattern: 桿体
    specs:
      - from: 桿体は明暗の判別に働く
        to: 杆体は明暗の判別に働く

  # 「あいだ」は漢字で書く。かなで書いた「〜あい」に「だ」が続く語（ばあいだ・
  # わりあいだ など）は記事では常に漢字で書いているため、絞り込みはしていない。
  - expected: 間
    pattern: あいだ
    specs:
      - from: カメラが写す範囲は、モデリング変換のあいだに現れる
        to: カメラが写す範囲は、モデリング変換の間に現れる
      - from: 内側から山と山のあいだの谷（外側）へ出る
        to: 内側から山と山の間の谷（外側）へ出る
      - from: 両眼で見ているあいだは互いに視野を補い合う
        to: 両眼で見ている間は互いに視野を補い合う
      - from: 円柱を引けば円い穴のあいた板になり
        to: 円柱を引けば円い穴のあいた板になり

  # 「ほか」は漢字で書く。ただし「〜にほかなりません」「〜するほかない」のように
  # 直後が「な」のときは漢字にすると不自然なので置き換えない。
  - expected: 他
    pattern: /ほか(?!な)/
    specs:
      - from: 描画のほかに音声の再生や入力機器の扱いまで含んだ
        to: 描画の他に音声の再生や入力機器の扱いまで含んだ
      - from: 明るい領域の境界はほかよりも明るく見え
        to: 明るい領域の境界は他よりも明るく見え
      - from: ほかと比べたときの順序や大小を表す数値
        to: 他と比べたときの順序や大小を表す数値
      - from: この集まりこそが、まさにラスタ表現にほかなりません。
        to: この集まりこそが、まさにラスタ表現にほかなりません。

  # 「そろう」「そろえる」は活用語尾までまとめて漢字で書く（揃わ・揃い・揃う・
  # 揃え・揃お・揃っ）。「そろそろいい」のような「そろそろ」＋活用語尾と同じ並びを
  # 拾ってしまうため、直前が「そろ」のときは置き換えない。
  - expected: 揃$1
    pattern: /(?<!そろ)そろ([わいうえおっ])/
    specs:
      - from: 偶数個でそろうのです。
        to: 偶数個で揃うのです。
      - from: 境界に沿って接平面までそろえると、つなぎ目が見えなくなります
        to: 境界に沿って接平面まで揃えると、つなぎ目が見えなくなります
      - from: つなぎ目のそろえ方には段階があります
        to: つなぎ目の揃え方には段階があります
      - from: 倍率がそろい、半径
        to: 倍率が揃い、半径
      - from: そろそろいいだろう
        to: そろそろいいだろう

  # 「つなぐ」は活用語尾までまとめて漢字で書く（繋が・繋ぎ・繋ぐ・繋げ・繋ご・繋い）。
  # 「せつない（切ない）」が「せ繋い」になってしまうため、直前が「せ」のときは
  # 置き換えない。
  - expected: 繋$1
    pattern: /(?<!せ)つな([がぎぐげごい])/
    specs:
      - from: 水晶体と毛様体をつなぐ細い線維であり
        to: 水晶体と毛様体を繋ぐ細い線維であり
      - from: プログラムの複雑さや計算量の増大につながります
        to: プログラムの複雑さや計算量の増大に繋がります
      - from: 各つなぎ目には接ベクトルを矢印で描き
        to: 各繋ぎ目には接ベクトルを矢印で描き
      - from: 端どうしをつないで長い形をつくります
        to: 端どうしを繋いで長い形をつくります
      - from: せつないほど淡い色
        to: せつないほど淡い色

  - expected: 振る舞い
    pattern: ふるまい
    specs:
      - from: 制御点の配置からふるまいを見積もるため
        to: 制御点の配置から振る舞いを見積もるため

  # 「あと」は続く助詞（に・から・で）までまとめて漢字にする。
  # 「あと」には〈跡〉の意味もあり、「足あと」「傷あと」を漢字にすると別語になるため、
  # 直前がその字のときは置き換えない。
  # 対象を広げたいときは助詞の選択肢（の・は など）を足す。
  - expected: 後$1
    pattern: /(?<![足傷])あと(に|から|で)/
    specs:
      - from: 重なるので、そのあとに描いて上書きする
        to: 重なるので、その後に描いて上書きする
      - from: 裏面を外したあとに何が残るかは
        to: 裏面を外した後に何が残るかは
      - from: どちらが見えるかは、あとから描いた面が先の面を覆う
        to: どちらが見えるかは、後から描いた面が先の面を覆う
      - from: 大きくなる並びも、このあとで効いてきます
        to: 大きくなる並びも、この後で効いてきます
      - from: 足あとにも似た形が残ります
        to: 足あとにも似た形が残ります

  # 「たりない」は漢字で書く。「あたり」「当たり」「隔たり」に「ない」が続く形
  # （〜あたりないし、隔たりないし）や、促音に続く「〜たり」（ぴったりない）を
  # 拾ってしまうため、直前がその字のときは置き換えない。
  # 「少したりない」を拾うため、「し」は除外に入れない。
  - expected: 足りない
    pattern: /(?<![あ当隔っ])たりない/
    specs:
      - from: 標本の数がたりないと、細かい変化を拾えません
        to: 標本の数が足りないと、細かい変化を拾えません
      - from: 少したりない明るさを補う
        to: 少し足りない明るさを補う
      - from: "`1`画素あたりないし`1`走査線あたりで数える"
        to: "`1`画素あたりないし`1`走査線あたりで数える"
      - from: 2点の隔たりないし距離を測る
        to: 2点の隔たりないし距離を測る

  - expected: 普通
    pattern: ふつう
    specs:
      - from: 個数で割るのがふつうの平均で
        to: 個数で割るのが普通の平均で
      - from: 交点はふつう偶数個になります
        to: 交点は普通偶数個になります

  # 「あわせる」は活用語尾までまとめて漢字で書く（合わせる・合わせて・合わせた・
  # 合わせない・合わせられる・合わせよう）。「あわせ」に続けて別語になる形は
  # 成立しないため、絞り込みはしていない。
  - expected: 合わせ$1
    pattern: /あわせ([るてたなられよ])/
    specs:
      - from: 反射率を波長ごとにかけあわせて求める
        to: 反射率を波長ごとにかけ合わせて求める
      - from: 枠の大きさにあわせて広げる
        to: 枠の大きさに合わせて広げる
      - from: 頂点を原点にあわせる
        to: 頂点を原点に合わせる

  - expected: 方が
    pattern: ほうが
    specs:
      - from: 画素のほうが明るければ白、暗ければ黒にします
        to: 画素の方が明るければ白、暗ければ黒にします
      - from: 分布を少数の数値へ要約できたほうが扱いやすくなります
        to: 分布を少数の数値へ要約できた方が扱いやすくなります

  # 時期を表す「ころ」は漢字で書く（「子どものころ」→「子どもの頃」）。
  # 直前が「と・ど・こ」のときは別語（ところ・出どころ・ところどころ・こころ）に
  # なるため置き換えない。直後が「が・げ・ぶ・も・す・し・っ・こ・り」のときも
  # 別語（転がる・転げる・転ぶ・衣・殺す・ころころ・ころっと・ころり）になるため
  # 対象にしない。
  - expected: 頃
    pattern: /(?<![とどこ])ころ(?![がげぶもすしっこり])/
    specs:
      - from: 子どものころに見た色は
        to: 子どもの頃に見た色は
      - from: そのころから絵の具が使われ
        to: その頃から絵の具が使われ
      - from: 明るいところでは、錐体が働きます
        to: 明るいところでは、錐体が働きます
      - from: 波の出どころになるため
        to: 波の出どころになるため
      - from: 縞をところどころ飛ばして描く
        to: 縞をところどころ飛ばして描く
      - from: こころよく感じる配色
        to: こころよく感じる配色
      - from: 斜面をころがる球
        to: 斜面をころがる球

  - expected: 滑らか
    pattern: なめらか
    specs:
      - from: なめらかな斜め線が標本化によって
        to: 滑らかな斜め線が標本化によって
      - from: 画像のなめらかさを左右する重要な選択です
        to: 画像の滑らかさを左右する重要な選択です

  # 「とおり」は漢字で書く（「次のとおりです」→「次の通りです」）。かなで
  # 「とおり」と書いて〈通り〉以外になる語は無いため、絞り込みはしていない。
  - expected: 通り
    pattern: とおり
    specs:
      - from: それぞれに当てはまる部屋は、次のとおりです。
        to: それぞれに当てはまる部屋は、次の通りです。
      - from: 「机の上での出版」という名前のとおり、大がかりな設備を
        to: 「机の上での出版」という名前の通り、大がかりな設備を

  # ---- かなで書く語 -------------------------------------------------------
  # 「この時」は「この時代」「この時期」「この時点」「この時間」「この時刻」
  # 「この時計」「この時系列」と続くと別語になるため、その続き字が来ない場合だけ
  # かなに置き換える。
  - expected: このとき
    pattern: /この時(?![代期点間刻計系])/
    specs:
      - from: この時、光は波長ごとに分かれます
        to: このとき、光は波長ごとに分かれます
      - from: この時代のヨーロッパでは
        to: この時代のヨーロッパでは
      - from: この時点では色みの差は現れません
        to: この時点では色みの差は現れません

  - expected: たとえば
    pattern: 例えば
    specs:
      - from: 例えば、赤と緑の間には黄色が見られます
        to: たとえば、赤と緑の間には黄色が見られます

  # 「掛ける」「掛かる」は活用語尾と複合名詞まで含めてかなで書く（掛け算→かけ算、
  # 掛け合わせる→かけ合わせる）。直前が「仕・手・気・足」のときは、かなにすると
  # 「仕かけ」「手かかり」のような別語になってしまうため置き換えない
  # （正しくは仕掛け・手がかり・気がかり・足がかり）。
  - expected: か$1
    pattern: /(?<![仕手気足])掛([けか])/
    specs:
      - from: 座標ベクトルに行列を掛けると、次の位置が求まります
        to: 座標ベクトルに行列をかけると、次の位置が求まります
      - from: "`1`回の掛け算で済みます"
        to: "`1`回のかけ算で済みます"
      - from: 変換行列をあらかじめ掛け合わせて作る
        to: 変換行列をあらかじめかけ合わせて作る
      - from: 係数に`0`が掛かって消える
        to: 係数に`0`がかかって消える
      - from: 手掛かりになる仕掛けを気掛かりに思う
        to: 手掛かりになる仕掛けを気掛かりに思う

  # 「凹み」はかなで書く。「凹凸」「凹形状」「凹んで」は「み」が続かないので
  # 当たらない。
  - expected: へこみ
    pattern: 凹み
    specs:
      - from: どこにも凹みのない:Anki[凸形状]なら
        to: どこにもへこみのない:Anki[凸形状]なら
      - from: 表面の凹凸を表現するために
        to: 表面の凹凸を表現するために
